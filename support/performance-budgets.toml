schema = "philo/performance-budgets"
schema_version = 2
owner = "performance"
benchmark_fixture = "benches/sdk_bench.rs"
benchmark_seed = 0

[environment]
runner = "github-hosted-ubuntu-latest"
profile = "release"
required_repetitions = 5
baseline_max_age_days = 30
require_matching_rust_os_arch_profile_features = true

[microbenchmark]
owner = "performance"
runner = "github-hosted-ubuntu-latest"
unit = "nanoseconds_per_iteration"
warmup_iterations = 10
smoke_cpu_iterations = 1000
full_cpu_iterations = 25000
smoke_async_iterations = 50
full_async_iterations = 1000

[[metric]]
name = "request_validation"
user_value = "bounded request preparation overhead"
owner = "domain"
unit = "nanoseconds_per_iteration"
runner = "github-hosted-ubuntu-latest"

[[metric]]
name = "sse_decoder"
user_value = "stream framing throughput"
owner = "transport"
unit = "nanoseconds_per_iteration"
runner = "github-hosted-ubuntu-latest"

[[metric]]
name = "openai_event_decode_hooks_disabled"
user_value = "OpenAI event decode and first domain result overhead"
owner = "openai-protocol"
unit = "nanoseconds_per_iteration"
runner = "github-hosted-ubuntu-latest"

[[metric]]
name = "openai_event_decode_hooks_enabled"
user_value = "bounded lifecycle observer overhead"
owner = "observability"
unit = "nanoseconds_per_iteration"
runner = "github-hosted-ubuntu-latest"

[[metric]]
name = "anthropic_event_decode"
user_value = "Anthropic event decode and first domain result overhead"
owner = "anthropic-protocol"
unit = "nanoseconds_per_iteration"
runner = "github-hosted-ubuntu-latest"

[[metric]]
name = "client_reuse_drop_resources"
user_value = "bounded memory and handle growth across reuse and stream drop"
owner = "reliability"
unit = "process-resource-delta"
runner = "github-hosted-ubuntu-latest"

[response_headers]
max_fields = 128
max_value_bytes = 16384
max_total_bytes = 65536
enforced_by = "src/execution/executor.rs"

[sse]
max_event_bytes = 1048576
max_line_bytes = 65536
max_fields_per_event = 128
max_chunk_bytes = 262144
max_bytes_per_poll = 65536
max_chunks_per_poll = 16
max_events_per_poll = 32
enforced_by = "src/transport/sse.rs"

[retry]
max_attempts = 8
default_attempts = 1
default_max_total_wait_millis = 60000
hard_max_configured_wait_millis = 3600000
enforced_by = "src/execution/reliability"

[network]
max_redirects = 5
max_no_proxy_entries = 64
max_custom_roots = 8
max_idle_connections_per_host = 64
enforced_by = "src/transport/network.rs and src/transport/reqwest.rs"

[benchmark_thresholds]
status = "approved"
warning_relative_regression_percent = 25
blocking_relative_regression_percent = 50
hook_enabled_overhead_warning_percent = 20
hook_enabled_overhead_blocking_percent = 50

[quick_soak]
owner = "reliability"
runner = "all-supported-platforms"
unit = "iterations"
default_iterations = 1000
capture_drain_interval = 256
max_retained_captures = 255
require_no_unconsumed_exchange = true
require_expected_drop_cleanup = true

[release_soak]
owner = "reliability"
runner = "github-hosted-ubuntu-latest"
unit = "process-resource-delta"
default_iterations = 100000
resource_sample_interval = 256
linux_max_rss_growth_kib = 65536
linux_max_thread_growth = 4
linux_max_file_descriptor_growth = 8
linux_max_socket_growth = 4
require_resource_metrics = true
enforced_by = "benches/client_soak.rs and .github/workflows/performance.yml"

[connection_churn]
owner = "transport"
runner = "github-hosted-ubuntu-latest"
unit = "iterations"
default_iterations = 25000
