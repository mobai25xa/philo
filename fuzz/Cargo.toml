[package]
name = "philo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.10"
futures-util = "0.3.31"
http = "1.3"
libfuzzer-sys = "0.4"
philo = { path = ".." }
philo-config = { path = "../crates/philo-config" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "sse_decoder"
path = "fuzz_targets/sse_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_stream"
path = "fuzz_targets/openai_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anthropic_stream"
path = "fuzz_targets/anthropic_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint_and_headers"
path = "fuzz_targets/endpoint_and_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "domain_schema_history_tools"
path = "fuzz_targets/domain_schema_history_tools.rs"
test = false
doc = false
bench = false

[[bin]]
name = "raw_body_and_error"
path = "fuzz_targets/raw_body_and_error.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parser"
path = "fuzz_targets/config_parser.rs"
test = false
doc = false
bench = false
