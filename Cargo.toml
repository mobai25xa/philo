# The core crate is also the workspace root. Everything under `crates/` is a
# responsibility that was adjudicated *out* of the core. Production dependency
# edges point from those crates to philo; root dev-dependencies compose them only
# for integration tests.
[workspace]
members = ["crates/philo-config", "crates/philo-presets"]
exclude = ["fuzz"]

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
name = "philo"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.97.1"
description = "A secure, streaming-first Rust SDK for multi-provider LLM applications"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mobai25xa/philo"
documentation = "https://docs.rs/philo"
keywords = ["llm", "openai", "sdk", "streaming"]
categories = ["api-bindings", "asynchronous"]
publish = ["crates-io"]
exclude = [
    ".gitattributes",
    ".github/**",
    ".gitignore",
    "benches/**",
    "compatibility/**",
    "deny.toml",
    "docs/**",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "support/**",
    "tests/**",
    "tools/**",
    "src/client/http_e2e_tests.rs",
    "src/client/release_tests.rs",
    "src/provider/profiles/test_only.rs",
    "src/transport/contract_tests.rs",
]

[[bench]]
name = "sdk_bench"
harness = false

[[bench]]
name = "client_soak"
harness = false

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls", "dep:rustls"]
tracing = ["dep:tracing"]

[dependencies]
base64 = "0.22"
bytes = "1.10"
futures-core = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "std"] }
http = "1.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", optional = true }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
philo-config = { path = "crates/philo-config" }
philo-presets = { path = "crates/philo-presets" }
proptest = "1.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
toml = "0.8"

[lints]
workspace = true
