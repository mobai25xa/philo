[package]
name = "philo"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
description = "A secure, streaming-first Rust SDK for multi-provider LLM applications"
license = "MIT"
readme = "README.md"
keywords = ["llm", "openai", "sdk", "streaming"]
categories = ["api-bindings", "asynchronous"]
publish = false

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
tracing = ["dep:tracing"]

[dependencies]
bytes = "1.10"
futures-core = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "std"] }
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", optional = true }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
