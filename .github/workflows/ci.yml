name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PHILO_GATE_SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
  PROPTEST_CASES: "256"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PHILO_GATE_SUBJECT }}
      - name: Verify and record the gate subject
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$PHILO_GATE_SUBJECT"
          {
            echo "## Hosted CI"
            echo ""
            echo "- Subject commit: \`$actual\`"
            echo "- Contract: \`philo/reliability-p4 1.0.0\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Architecture fitness gate
        run: cargo test -p philo --test architecture_fitness
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify the core release package
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p philo --allow-dirty
          if cargo package -p philo --allow-dirty --list | grep -E '(^|/)src/provider/profiles/test_only.rs$'; then
            echo "test_only source leaked into the release package" >&2
            exit 1
          fi

  platforms:
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PHILO_GATE_SUBJECT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo test --workspace --all-targets

  msrv:
    name: Declared Rust 1.97.1
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml's development "stable" channel for this gate.
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PHILO_GATE_SUBJECT }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: msrv-1.97.1
      - run: rustc --version --verbose
      - run: cargo test --workspace --all-targets

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PHILO_GATE_SUBJECT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo check --workspace --no-default-features
      - run: cargo check --workspace --all-features
      - run: cargo test --workspace --all-targets --no-default-features

  dependencies:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PHILO_GATE_SUBJECT }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check

  hosted-ci-gate:
    name: Hosted CI gate
    if: always()
    needs: [quality, platforms, msrv, features, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Require every hosted check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          PLATFORMS: ${{ needs.platforms.result }}
          MSRV: ${{ needs.msrv.result }}
          FEATURES: ${{ needs.features.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$QUALITY" "$PLATFORMS" "$MSRV" "$FEATURES" "$DEPENDENCIES"; do
            test "$result" = "success"
          done
          {
            echo "## Hosted CI gate passed"
            echo ""
            echo "- Subject commit: \`$PHILO_GATE_SUBJECT\`"
            echo "- Contract: \`philo/reliability-p4 1.0.0\`"
          } >> "$GITHUB_STEP_SUMMARY"
