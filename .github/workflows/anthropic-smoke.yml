name: Official Anthropic Smoke

on:
  workflow_dispatch:
    inputs:
      subject_commit:
        description: Full 40-character commit SHA already reviewed and green in CI
        required: true
        type: string
      model:
        description: Verified official Anthropic Messages model ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: official-anthropic-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Messages controlled suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: official-anthropic-smoke
    env:
      ANTHROPIC_SMOKE_COMMIT: ${{ inputs.subject_commit }}
      ANTHROPIC_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.subject_commit }}
      - name: Verify protected inputs and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ANTHROPIC_SMOKE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ANTHROPIC_MODEL" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$(git rev-parse HEAD)" = "$ANTHROPIC_SMOKE_COMMIT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Run the opt-in Anthropic Messages smoke suite
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY"
          cargo test --all-features --test anthropic_smoke -- --ignored --nocapture 2>&1 \
            | tee anthropic-smoke.log
      - name: Archive redacted smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-anthropic-smoke-${{ inputs.subject_commit }}
          path: anthropic-smoke.log
          if-no-files-found: warn
          retention-days: 30
      - name: Record safe smoke metadata
        if: always()
        shell: bash
        run: |
          safe_model="<invalid>"
          if [[ "$ANTHROPIC_MODEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            safe_model="$ANTHROPIC_MODEL"
          fi
          {
            echo "## Official Anthropic Messages smoke"
            echo ""
            echo "- Subject commit: \`$ANTHROPIC_SMOKE_COMMIT\`"
            echo "- Date (UTC): $(date -u +%F)"
            echo "- Contract: \`philo/anthropic-messages-p5 1.0.0\`"
            echo "- Model: \`$safe_model\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Prompt, output, API key, thinking, tool arguments, and provider request ID values: not recorded"
          } >> "$GITHUB_STEP_SUMMARY"
