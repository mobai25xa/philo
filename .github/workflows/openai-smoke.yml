name: Official OpenAI Smoke

on:
  workflow_dispatch:
    inputs:
      subject_commit:
        description: Full 40-character commit SHA already reviewed and green in CI
        required: true
        type: string
      model:
        description: Verified official OpenAI Chat Completions model ID
        required: true
        type: string
      capabilities:
        description: Comma-separated verified capabilities
        required: true
        type: string
      image_url:
        description: Public HTTPS image URL without credentials/query/fragment; required for vision
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: official-openai-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Phase 2 capability suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: official-openai-smoke
    env:
      OPENAI_SMOKE_ENABLED: "true"
      OPENAI_SMOKE_COMMIT: ${{ inputs.subject_commit }}
      OPENAI_SMOKE_MODEL: ${{ inputs.model }}
      OPENAI_SMOKE_CAPABILITIES: ${{ inputs.capabilities }}
      OPENAI_SMOKE_IMAGE_URL: ${{ inputs.image_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.subject_commit }}
      - name: Verify protected inputs and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OPENAI_SMOKE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENAI_SMOKE_MODEL" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$OPENAI_SMOKE_CAPABILITIES" =~ ^[a-z_,]+$ ]]
          test "$(git rev-parse HEAD)" = "$OPENAI_SMOKE_COMMIT"

          if [[ ",$OPENAI_SMOKE_CAPABILITIES," == *,vision,* ]]; then
            test -n "$OPENAI_SMOKE_IMAGE_URL"
            [[ "$OPENAI_SMOKE_IMAGE_URL" == https://* ]]
            [[ "$OPENAI_SMOKE_IMAGE_URL" != *"?"* ]]
            [[ "$OPENAI_SMOKE_IMAGE_URL" != *"#"* ]]
            [[ "$OPENAI_SMOKE_IMAGE_URL" != *"@"* ]]
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Run the opt-in phase 2 smoke suite
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          cargo test --all-features --test openai_smoke -- --nocapture 2>&1 | tee openai-smoke.log
      - name: Archive redacted smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-openai-smoke-${{ inputs.subject_commit }}
          path: openai-smoke.log
          if-no-files-found: warn
          retention-days: 30
      - name: Record safe smoke metadata
        if: always()
        shell: bash
        run: |
          safe_model="<invalid>"
          if [[ "$OPENAI_SMOKE_MODEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            safe_model="$OPENAI_SMOKE_MODEL"
          fi
          {
            echo "## Official OpenAI phase 2 smoke"
            echo ""
            echo "- Subject commit: \`$OPENAI_SMOKE_COMMIT\`"
            echo "- Date (UTC): $(date -u +%F)"
            echo "- Contract: \`philo/openai-chat-p2 1.1.0\`"
            echo "- Model: \`$safe_model\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Prompt, output, API key, image URL, and provider request ID values: not recorded"
          } >> "$GITHUB_STEP_SUMMARY"
