[package]
name = "philo-config"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.97.1"
description = "Versioned, layered provider configuration for the philo SDK core"
license = "MIT"
publish = false

[dependencies]
philo = { version = "=1.0.0-rc.1", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
http = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[lints]
workspace = true
