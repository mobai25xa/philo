[package]
name = "philo-config"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
description = "Versioned, layered provider configuration for the philo SDK core"
license = "MIT"
publish = false

[dependencies]
philo = { version = "=0.1.0-alpha.1", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
http = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
